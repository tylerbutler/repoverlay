[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Build only the required packages, and individually
precise-builds = true
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Publish jobs to run in CI
pr-run-mode = "plan"
# Whether to install an updater program
install-updater = false
# Generate GitHub Artifact Attestations (SLSA build provenance) for release binaries
github-attestations = true

# Host releases on GitHub
hosting = ["github"]
# Homebrew tap to publish formula to
tap = "tylerbutler/homebrew-tap"
# Custom publish job: `publish-homebrew-tap.yml` authenticates to the tap via
# a GitHub App installation token instead of a PAT. Keeps the homebrew
# *installer* (formula .rb generation) active — that's driven by the
# `installers` array above, not by publish-jobs.
publish-jobs = ["./publish-homebrew-tap"]
