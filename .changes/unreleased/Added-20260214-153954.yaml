kind: Added
body: |-
    Deep merge `.json` files during overlay application

    Resolve `.json` file conflicts automatically instead of failing. When `--merge` is enabled
    (via CLI flag or `REPOVERLAY_MERGE` env var), JSON files are recursively deep merged — objects
    merge key-by-key with overlay values winning, arrays and scalars use overlay values directly,
    and type mismatches are logged with full dotted key paths. Merged files are tracked with a new
    `Merged` link type in overlay state for correct cleanup on remove/update.
