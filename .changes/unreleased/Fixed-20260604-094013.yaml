kind: Fixed
body: |-
    Keep profile-written files out of git status

    Files that a profile writes into your repository (agent instructions,
    `.mcp.json`, placed skills and agents, and plugin directories) are now
    excluded from git via a per-profile section in `.git/info/exclude`, so they
    no longer show up as untracked changes. The exclusions are added when a
    profile is applied and removed when it is removed, and `repoverlay repair`
    rebuilds them if they go missing.
time: 2026-06-04T09:40:13-07:00
