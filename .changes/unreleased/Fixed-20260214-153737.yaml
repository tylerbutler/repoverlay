kind: Security
body: |-
    Reject git refs starting with `-` to prevent flag injection

    Source URLs with refs like `--upload-pack=evil` could be passed through to git commands
    as flags. `GitRef::from_str` now rejects any ref beginning with `-` and
    `with_ref_override` propagates the error instead of panicking via `.unwrap()`.
