kind: Security
body: |-
    Reject symlinks that escape the overlay source directory during copy

    Malicious overlay repositories could include symlinks pointing outside their
    directory tree (e.g., to /etc/passwd). The copy operation now checks each
    entry with symlink_metadata and rejects any symlink whose target resolves
    outside the source root. Also adds a recursion depth limit (64) to prevent
    stack overflow from circular symlinks.
