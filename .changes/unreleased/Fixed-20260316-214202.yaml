kind: Fixed
body: |-
    Auto-repair `.git/info/exclude` when entries are out of sync

    `repoverlay status` now rebuilds git exclude entries from overlay state if
    they've gotten out of sync (e.g. after `git clean`, manual edits, or
    interrupted operations). Prints a maintenance note when repairs are made.
