kind: Fixed
body: |-
    Preserve profile ownership during overlay removal

    Include profiles in interactive removal and preserve unrelated profile state,
    backups, configuration, and library files. Block standalone removal, switching,
    and forced replacement of profile-owned overlays, with live-session lock
    checks before changes. Preserve profile state during batch-apply rollback.
    Include profile-owned overlays in removal previews.
