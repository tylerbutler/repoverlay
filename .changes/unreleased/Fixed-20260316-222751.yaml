kind: Fixed
body: |-
    Write git exclude entries to the common git directory for worktrees

    Git reads `info/exclude` from the shared `.git/` directory, not the
    worktree-specific `$GIT_DIR`. Overlay files applied in worktree checkouts
    would show as untracked because exclude entries were written to the wrong
    location. Now uses `git rev-parse --git-path` to resolve the correct path.
time: 2026-03-16T22:27:51Z
component: fixes
