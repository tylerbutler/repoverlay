kind: Added
body: |-
    Auto-detect configured source when applying via GitHub URL

    When applying an overlay via a GitHub URL that matches a configured source,
    resolve it as an overlay repo (editable and syncable) instead of a read-only
    GitHub source. URLs with an org/repo/name subpath redirect to three-part
    resolution; bare repo URLs use interactive browse mode with the matched source.
time: 2026-03-04T12:00:00-08:00
component: apply
