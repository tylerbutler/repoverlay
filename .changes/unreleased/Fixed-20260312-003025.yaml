kind: Fixed
body: |-
    Fix `edit add` failing on directories with "Is a directory" error

    The `edit add` command now correctly handles directories (e.g., `.claude/commands`) by using
    recursive directory copy, directory symlinks, and `EntryType::Directory` in overlay state.
    Rollback logic also properly restores directories on failure.
