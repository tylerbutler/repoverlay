kind: Changed
body: |-
    `edit` defaults to interactive file selection when no flags given

    Running `repoverlay edit <name>` without `--add`, `--remove`, or `--interactive`
    in an interactive terminal now launches interactive file re-selection automatically.
    Non-interactive environments are unaffected.
