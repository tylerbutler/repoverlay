kind: Added
body: |-
    Add overlay composition via `extends` and `includes`

    Overlays can now inherit files from other library overlays using two new
    `repoverlay.ccl` sections. Multi-level chains are supported with cycle detection.

    **`extends`** inherits all files from a parent overlay. The child's own files
    take precedence on conflict, making this ideal for creating specialized variants
    of a base overlay:

    ```

    extends =

      overlay = base-config

    ```

    Use case: a `claude-config-strict` overlay that extends `claude-config` and
    overrides just the `CLAUDE.md` file while inheriting everything else.

    **`includes`** cherry-picks specific files from other overlays, useful when you
    only need a few shared files without full inheritance:

    ```

    includes =

      overlay = shared-dotfiles

      files =

        .editorconfig

        .prettierrc

    ```

    Use case: multiple overlays that each need the same `.editorconfig` from a
    shared dotfiles overlay, without duplicating the file.

    Both features are restricted to library overlays.
