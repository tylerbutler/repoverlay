kind: Fixed
body: |-
    Allow overlay operations when git exclude updates fail

    Apply, remove, and switch no longer abort when `.git/info/exclude`
    cannot be updated (e.g. in codespace worktrees with non-portable
    absolute paths). A warning is shown and the operation continues —
    overlay files may appear as untracked in git status.
time: 2026-03-17T03:31:33Z
component: fixes
