kind: Fixed
body: |-
    Fix sync --all skipping overlays from the overlay repo GitHub source

    Overlays applied via two-part browse mode (e.g., `repoverlay apply owner/repo-overlays`)
    are stored with a GitHub source type rather than an OverlayRepo source type. The sync
    command now detects these by checking if the GitHub URL matches a configured overlay
    source and the subpath contains a valid org/repo/name reference.
time: 2026-02-18T20:29:00-08:00
component: sync
