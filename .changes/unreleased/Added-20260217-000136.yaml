kind: Added
body: |-
    Add flat list selector for overlay apply and remove pickers

    The `remove` command now uses a multi-select picker instead of a numbered
    list, allowing multiple overlays to be removed at once. The `apply` overlay
    picker shows already-applied overlays as disabled entries. Both pickers
    support keyboard navigation, search filtering, and select-all toggling.
