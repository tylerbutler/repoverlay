kind: Added
body: |-
    Auto-filter overlays by current repository

    When browsing or selecting overlays, the current repository is auto-detected
    from git remotes (origin and upstream). Matching overlays are shown first;
    non-matching overlays are labeled "different repo" in the interactive picker.
    Text listing filters to matching overlays by default. Use `--show-all` to
    see all overlays.
