component: misc
kind: Fixed
body: |-
    Homebrew formula for 0.13.1 is available in `tylerbutler/homebrew-tap`

    The 0.13.0 release failed to publish its Homebrew formula when the
    `HOMEBREW_TAP_TOKEN` PAT returned `401 Bad credentials`. 0.13.1 is
    functionally identical to 0.13.0 but cut after switching the tap
    publish job to a GitHub App installation token, so `brew install
    tylerbutler/tap/repoverlay` now resolves.
