kind: Performance
component: create
body: |-
    Fix UI hang on large repos during overlay creation

    Skip transient tool state directories (worktrees/, todos/) during AI config
    directory walking, reducing discovered files from ~59K to ~22 on repos with
    large .claude/ directories. Also fix O(n²) ancestor traversal in the selection
    UI with a pre-built parent lookup map, and add a progress spinner with Ctrl+C
    support for git clone/pull operations.
time: 2026-03-11T12:00:00Z
