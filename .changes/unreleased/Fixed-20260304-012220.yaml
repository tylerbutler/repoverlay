kind: Fixed
body: |-
    Fix `edit --add` dropping existing git exclude entries

    When adding files to an applied overlay, the git exclude section was
    rewritten with only the newly added files, silently removing entries for
    previously managed files. This caused those files to reappear in
    `git status` after the add operation. Rebuilt the full exclude list from
    overlay state, matching the pattern already used by `edit --remove`.
