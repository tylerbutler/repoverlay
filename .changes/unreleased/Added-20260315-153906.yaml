kind: Added
body: |-
    Auto-detect flat folder layout for local sources

    Local directory sources no longer require `org/repo/name` nesting. Flat
    directories are auto-detected: a directory with overlay files is treated
    as a single overlay, and subdirectories are each treated as separate
    overlays.
time: 2026-03-15T15:39:06-07:00
component: browse
