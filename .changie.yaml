changesDir: .changes
unreleasedDir: unreleased
headerPath: header.md
changelogPath: CHANGELOG.md
versionHeaderPath: ""
versionFooterPath: ""
versionExt: md
envPrefix: CHANGIE
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '#### {{.Kind}}'
changeFormat: |-
    ##### {{(splitn "\n" 2 .Body)._0}}
    {{with (splitn "\n" 2 .Body)._1 | default "" | trim}}
    {{regexReplaceAll "([^\n])\n([^\n])" . "${1} ${2}"}}
    {{end}}
body:
    block: true
    minLength: 1
kinds:
    - label: Added
      auto: minor
    - label: Fixed
      auto: patch
    - label: Performance
      auto: patch
    - label: Changed
      auto: patch
    - label: Reverted
      auto: patch
    - label: Dependencies
      auto: patch
    - label: Security
      auto: patch
componentFormat: '{{if .Component}}{{if eq .Component "features"}}### Features{{else if eq .Component "fixes"}}### Fixes{{else if eq .Component "misc"}}### Miscellaneous{{else}}### Command: `{{.Component}}`{{end}}{{end}}'
components:
    - features
    - fixes
    - misc
    - library
    - apply
    - browse
    - cache
    - create
    - create-local
    - edit
    - list
    - remove
    - restore
    - source
    - status
    - switch
    - sync
    - update
newlines:
    afterChangelogHeader: 1
    afterChangelogVersion: 1
    afterComponent: 1
    afterKind: 1
    afterVersion: 1
    beforeComponent: 1
    beforeKind: 1
    endOfVersion: 1
