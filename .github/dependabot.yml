version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    groups:
      rust-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  # NOTE: .github/workflows/release.yml is auto-generated by cargo-dist.
  # Dependabot cannot exclude specific files (see github.com/dependabot/dependabot-core/issues/2857).
  # Auto-close PRs for actions/checkout, actions/upload-artifact, actions/download-artifact
  # if they only modify release.yml - regenerate with: cargo dist generate
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
