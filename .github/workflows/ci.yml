name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ vars.RUNS_ON_TEST || vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - run: cargo test --all-features

  lint:
    name: Clippy
    runs-on: ${{ vars.RUNS_ON_LINT || vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  format:
    name: Format
    runs-on: ${{ vars.RUNS_ON_FORMAT || vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ${{ vars.RUNS_ON_DOCS || vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  # Record binary size on main branch pushes for PR comparisons
  binary-size:
    name: Record Binary Size
    runs-on: ${{ vars.RUNS_ON_BINARY_SIZE || vars.RUNS_ON || 'ubuntu-latest' }}
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - name: Build release binary
        run: cargo build --release
      - name: Record binary size
        run: |
          SIZE=$(stat --format="%s" target/release/repoverlay)
          echo "$SIZE" > binary-size.txt
          echo "Main binary size: $SIZE bytes"
      - name: Upload binary size artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: binary-size-main
          path: binary-size.txt
          retention-days: 90
