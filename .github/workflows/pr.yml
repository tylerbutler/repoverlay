name: PR Validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  # Semver compatibility check with PR comments
  semver:
    name: Semver Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/install-tools
        with:
          tools: cargo-semver-checks
      - name: Get merge base
        id: merge-base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MERGE_BASE=$(git merge-base origin/main HEAD)
          echo "sha=$MERGE_BASE" >> "$GITHUB_OUTPUT"
      - name: Check semver compatibility
        id: semver
        env:
          MERGE_BASE_SHA: ${{ steps.merge-base.outputs.sha }}
        run: |
          set +e
          OUTPUT=$(cargo semver-checks --baseline-rev "$MERGE_BASE_SHA" --color never 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "has_breaking=$([[ $EXIT_CODE -ne 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment on PR with breaking changes
        if: steps.semver.outputs.has_breaking == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: semver-check
          message: |
            ## Semver Breaking Changes Detected

            This PR introduces API changes that may be semver-incompatible:

            ```
            ${{ steps.semver.outputs.output }}
            ```

            If these changes are intentional, please ensure the version bump reflects the breaking change.
      - name: Remove semver comment if no breaking changes
        if: steps.semver.outputs.has_breaking == 'false'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: semver-check
          delete: true

  # Binary size comparison
  binary-size:
    name: Binary Size
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - name: Checkout PR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: ./.github/actions/setup-rust

      - name: Build PR binary
        run: cargo build --release

      - name: Get PR binary size
        id: pr-size
        run: |
          SIZE=$(stat --format="%s" target/release/repoverlay)
          echo "bytes=$SIZE" >> "$GITHUB_OUTPUT"
          echo "PR binary size: $SIZE bytes"

      - name: Download main binary size artifact
        id: download-main-size
        uses: dawidd6/action-download-artifact@2536c51d3d126276eb39f74d6bc9c72ac6ef30d3 # ratchet:dawidd6/action-download-artifact@v16
        with:
          workflow: ci.yml
          branch: main
          name: binary-size-main
          path: main-size
          if_no_artifact_found: warn

      - name: Get main binary size
        id: main-size
        run: |
          if [ -f main-size/binary-size.txt ]; then
            SIZE=$(cat main-size/binary-size.txt)
            echo "bytes=$SIZE" >> "$GITHUB_OUTPUT"
            echo "Main binary size: $SIZE bytes"
          else
            echo "::warning::No main binary size artifact found, skipping comparison"
            echo "bytes=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate size difference
        id: diff
        if: steps.main-size.outputs.bytes != '0'
        env:
          PR_SIZE: ${{ steps.pr-size.outputs.bytes }}
          MAIN_SIZE: ${{ steps.main-size.outputs.bytes }}
        run: python3 scripts/binary-size-diff.py "$PR_SIZE" "$MAIN_SIZE" --github-output "$GITHUB_OUTPUT"

      - name: Comment on PR with size change
        if: steps.main-size.outputs.bytes != '0' && steps.diff.outputs.significant == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: binary-size
          message: |
            ## Binary Size Change

            | Metric | Value |
            |--------|-------|
            | This PR | ${{ steps.diff.outputs.pr_size }} |
            | main | ${{ steps.diff.outputs.main_size }} |
            | Change | ${{ steps.diff.outputs.diff }} (${{ steps.diff.outputs.percent }}) |

      - name: Remove size comment if not significant
        if: steps.main-size.outputs.bytes != '0' && steps.diff.outputs.significant == 'false'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: binary-size
          delete: true

  # Changelog entry check
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: tylerbutler/actions/changie-check@231702af96884c81aba2e69d60ed8ed7d23da69b # ratchet:tylerbutler/actions/changie-check@main
        id: changelog
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
      - name: Comment with changelog preview
        if: steps.changelog.outputs.has-entries == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: changelog
          message: |
            ## Changelog Preview

            This PR adds the following changelog entries:

            ${{ steps.changelog.outputs.preview }}
      - name: Comment about missing changelog
        if: steps.changelog.outputs.has-entries == 'false' && steps.changelog.outputs.needs-entry == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: changelog
          message: |
            ## Missing Changelog Entry

            This PR includes commits with types that typically require a changelog entry (`${{ steps.changelog.outputs.commit-types-found }}`), but no changie fragment was found.

            To add one, run:

            ```
            changie new
            ```
      - name: Remove changelog comment
        if: steps.changelog.outputs.has-entries == 'false' && steps.changelog.outputs.needs-entry == 'false'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: changelog
          delete: true
