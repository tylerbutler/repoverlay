[package]
name = "repoverlay"
version = "0.13.0"
edition = "2024"
rust-version = "1.91"
authors = ["Tyler Butler <tyler@tylerbutler.com>"]
description = "Overlay config files into git repositories without committing them"
license = "MIT"
repository = "https://github.com/tylerbutler/repoverlay"
homepage = "https://github.com/tylerbutler/repoverlay"
keywords = ["git", "overlay", "config", "symlink", "dotfiles"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".claude/",
    ".github/",
    ".planning/",
    ".serena/",
    ".vscode/",
    "docs/",
    "metrics/",
    "mutants.out/",
    "mutants.out.old/",
    "scripts/",
    "website/",
    "repopo.config.ts",
    "package.json",
    "pnpm-lock.yaml",
    "hk.pkl",
    "codecov.yml",
]

[lib]
name = "repoverlay"
path = "src/lib.rs"

[[bin]]
name = "repoverlay"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive", "env"] }
clap_complete = "4.6.1"
clap-markdown = "0.1.5"
env_logger = "0.11.10"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
walkdir = "2.5.0"
chrono = { version = "0.4.44", features = ["serde"] }
thiserror = "2.0.18"
anyhow = "1.0.102"
colored = "3.1.1"
url = "2.5.8"
directories = "6.0.0"
dialoguer = "0.12.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
tui-tree-widget = "0.24"
sickle = { version = "0.2", features = ["serde"] }
dirs = "6.0.0"
fuzzy-matcher = "0.3.7"
libc = "0.2.185"
tiny-update-check = "1.1.1"
similar = "2.7.0"
indicatif = "0.18.4"
ctrlc = "3.5.2"
glob = "0.3.3"
tempfile = "3"

[build-dependencies]
vergen = { version = "9", features = ["build"] }

[dev-dependencies]
assert_cmd = "2.2"
insta = "1"
predicates = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Enables the `cargo build --profile profiling` command
[profile.profiling]
inherits = "release"
debug = true

# Profile for cargo-bloated analysis (requires panic=unwind)
[profile.bloat]
inherits = "release"
panic = "unwind"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow some pedantic lints that are too noisy
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
cognitive_complexity = "allow"
significant_drop_tightening = "allow"
# We explicitly use pub(crate) for API surface clarity even in private modules
redundant_pub_crate = "allow"
